<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starter- Do Now: Tile Grab</title>
<style>
:root {
  --bg: #FEF6E4; --ink: #000000; --title: #264653; --red: #D00000; --answer: #00B050; --card: #FFFFFF; --edge: #000000; --muted: #4A4A4A; --chip: #F1E6CC;
  --c1: #F4A261; --c2: #8ECAE6; --c3: #B8E0D2; --used: #D9D9D9; --usedInk: #6B6B6B;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #1C2326; --ink: #F3F3F3; --title: #9FD3E0; --red: #FF6B6B; --answer: #48D597; --card: #2A3337; --edge: #C9C9C9; --muted: #BDBDBD; --chip: #34403F; --c1: #8A5A33; --c2: #2E5F72; --c3: #3A6157; --used: #3A4246; --usedInk: #9AA3A6; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #1C2326; --ink: #F3F3F3; --title: #9FD3E0; --red: #FF6B6B; --answer: #48D597; --card: #2A3337; --edge: #C9C9C9; --muted: #BDBDBD; --chip: #34403F; --c1: #8A5A33; --c2: #2E5F72; --c3: #3A6157; --used: #3A4246; --usedInk: #9AA3A6; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 1.2rem 0; }
header img { width: clamp(52px, 6vw, 84px); height: auto; border-radius: 8px; }
h1 { font-weight: 400; color: var(--title); font-size: clamp(2rem, 5.2vw, 4.6rem); margin: 0; line-height: 1.05; }
.sub { margin-left: auto; text-align: right; color: var(--title); font-weight: 700; font-size: clamp(1.1rem, 2.2vw, 1.8rem); }
.sub span { display: block; color: var(--muted); font-weight: 400; font-size: clamp(0.9rem, 1.5vw, 1.2rem); }
main { flex: 1; display: grid; grid-template-columns: 1fr minmax(190px, 22%); gap: 1.2rem; padding: 0.8rem 1.2rem 0.6rem; min-height: 0; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto repeat(4, 1fr); gap: 0.7rem; min-height: 0; }
.cat { text-align: center; font-weight: 700; font-size: clamp(1rem, 2.1vw, 1.8rem); color: var(--ink); padding: 0.4rem; border-radius: 12px; border: 3px solid var(--edge); }
.tile { font: inherit; font-weight: 700; font-size: clamp(1.6rem, 4vw, 3.4rem); border: 4px solid var(--edge); border-radius: 14px; cursor: pointer; color: var(--ink); min-height: 3.2rem; }
.tile.used { background: var(--used) !important; color: var(--usedInk); cursor: default; font-size: clamp(0.9rem, 1.6vw, 1.3rem); font-weight: 400; }
.k1 { background: var(--c1); } .k2 { background: var(--c2); } .k3 { background: var(--c3); }
aside { display: flex; flex-direction: column; gap: 0.8rem; min-width: 0; }
.panel { background: var(--card); border: 4px solid var(--edge); border-radius: 14px; text-align: center; padding: 0.6rem; }
.panel .t { font-size: clamp(2.2rem, 4.6vw, 4rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--title); }
.panel.done .t { color: var(--red); }
.panel small { display: block; color: var(--muted); font-size: 0.95rem; }
.teams { background: var(--chip); border-radius: 14px; padding: 0.6rem; display: flex; flex-direction: column; gap: 0.45rem; }
.teams h2 { font-size: 1.1rem; margin: 0 0 0.2rem; color: var(--title); }
.team { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.4rem; }
.team input { font: inherit; width: 100%; min-width: 0; background: var(--card); color: var(--ink); border: 2px solid var(--edge); border-radius: 8px; padding: 0.2rem 0.4rem; }
.team .s { font-size: 1.6rem; font-weight: 700; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; background: var(--card); color: var(--ink); border: 3px solid var(--edge); border-radius: 10px; padding: 0.35rem 0.8rem; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--red); outline-offset: 2px; }
.instr { color: var(--red); font-weight: 700; text-align: center; font-size: clamp(1rem, 2vw, 1.7rem); padding: 0.2rem 1rem 0.4rem; }
footer { display: flex; align-items: center; justify-content: flex-end; padding: 0 1.2rem 0.7rem; gap: 0.8rem; }
footer img { width: 54px; height: auto; }
/* question overlay */
.q { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; padding: calc(0.8rem + env(safe-area-inset-top, 0px)) 1.4rem calc(0.8rem + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.q.open { display: flex; }
.qhead { display: flex; align-items: center; gap: 1rem; }
.qhead .badge { font-weight: 700; font-size: clamp(1.1rem, 2.2vw, 1.8rem); padding: 0.3rem 0.9rem; border-radius: 12px; border: 3px solid var(--edge); }
.qhead .pts { margin-left: auto; font-size: clamp(1.1rem, 2.2vw, 1.8rem); color: var(--title); font-weight: 700; }
.qbody { flex: 1; display: grid; grid-template-columns: 1fr minmax(190px, 22%); gap: 1.2rem; margin-top: 0.8rem; min-height: 0; }
.qtext { font-size: clamp(1.9rem, 4.8vw, 4.2rem); line-height: 1.2; margin: 0.4rem 0 1rem; max-width: 26ch; }
.ans { font-size: clamp(1.3rem, 3vw, 2.6rem); color: var(--answer); line-height: 1.3; max-width: 40ch; }
.ans b { color: var(--ink); font-weight: 400; }
.hidden { visibility: hidden; }
.award { background: var(--chip); border-radius: 14px; padding: 0.6rem; display: flex; flex-direction: column; gap: 0.45rem; }
.award h2 { font-size: 1.05rem; margin: 0; color: var(--title); }
.award button.on { background: var(--answer); color: #000; border-color: var(--answer); font-weight: 700; }
.qfoot { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
.qfoot .reveal { background: var(--title); color: var(--bg); border-color: var(--title); font-weight: 700; font-size: clamp(1rem, 1.8vw, 1.4rem); }
.qfoot .back { font-weight: 700; font-size: clamp(1rem, 1.8vw, 1.4rem); }
.qfoot .instr { flex: 1; }
@media (max-width: 760px) { main, .qbody { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .ans:not(.hidden) { animation: pop 0.25s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
</style>
</head>

<div class="q" id="q" role="dialog" aria-modal="true" aria-labelledby="qText">
  <div class="qhead"><span class="badge" id="qCat"></span><span class="pts" id="qPts"></span></div>
  <div class="qbody">
    <div>
      <p class="qtext" id="qText"></p>
      <div class="ans hidden" id="qAns"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.8rem">
      <div class="panel" id="qBox"><small>Thinking time</small><div class="t" id="qt">0:20</div><button id="qBtn">Start</button></div>
      <div class="award"><h2>Correct? Tap each team</h2><div id="award" style="display:flex;flex-direction:column;gap:0.4rem"></div></div>
    </div>
  </div>
  <div class="qfoot">
    <button class="reveal" id="reveal">Show answer</button>
    <div class="instr" id="qInstr">Write your answer on your mini-whiteboard. Show me on 3-2-1.</div>
    <button class="back" id="back">Back to board</button>
  </div>
</div>
<script>
const CATS = [
  { name: 'Say what it means', k: 'k1' },
  { name: 'True or false?', k: 'k2' },
  { name: 'Symbol fix', k: 'k3' },
];
// [category][row] ; points = row + 1
const QS = [
  [
    { q: 'Finish the sentence: a compound contains atoms of ______ elements chemically bonded.', a: '<b>Answer:</b> different' },
    { q: 'What is a molecule?', a: '<b>Answer:</b> two or more atoms bonded together' },
    { q: 'What is a chemical bond?', a: '<b>Answer:</b> a strong link that holds atoms together' },
    { q: 'Give one difference between a compound and a mixture.', a: '<b>Answer:</b> in a compound the different atoms are chemically bonded, making a new substance with its own properties; in a mixture the substances are not bonded and keep their own properties' },
  ],
  [
    { q: 'True or false? Every molecule is a compound.', a: '<b>Answer:</b> False. O<sub>2</sub> and N<sub>2</sub> are molecules, but each has only one type of atom, so they are elements.' },
    { q: 'True or false? CO<sub>2</sub> is a molecule and a compound.', a: '<b>Answer:</b> True. Its atoms are bonded (molecule) and they are from different elements (compound).' },
    { q: 'True or false? N<sub>2</sub> is a compound because its atoms are bonded.', a: '<b>Answer:</b> False. Bonded atoms make a molecule, but N<sub>2</sub> has only one type of atom, so it is an element.' },
    { q: 'True or false? Air is a compound because it contains O<sub>2</sub> and N<sub>2</sub> molecules.', a: '<b>Answer:</b> False. The O<sub>2</sub> and N<sub>2</sub> molecules are not bonded to each other, so air is a mixture.' },
  ],
  [
    { q: 'Fix the symbol for sodium: nA', a: '<b>Answer:</b> Na (capital first letter, lower-case second letter)' },
    { q: 'Fix the symbol for chlorine: CL', a: '<b>Answer:</b> Cl. Two capitals would mean two different elements.' },
    { q: 'Which one is cobalt: Co or CO? What does the other one mean?', a: '<b>Answer:</b> Co is cobalt. CO means one carbon atom and one oxygen atom (carbon monoxide).' },
    { q: 'Fix this formula for carbon dioxide: Co2', a: '<b>Answer:</b> CO<sub>2</sub>. Capital C and capital O, and the 2 is a small subscript. Co would mean cobalt.' },
  ],
];
const TEAMS = ['Team 1', 'Team 2', 'Team 3', 'Team 4'].map(n => ({ n, s: 0 }));
const used = {}; let cur = null, awarded = new Set();
const $ = id => document.getElementById(id);
function timer(box, out, btn, secs) {
  let left = secs, h = null;
  const draw = () => { out.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; };
  const stop = () => { clearInterval(h); h = null; btn.textContent = left <= 0 ? 'Restart' : 'Start'; };
  btn.onclick = () => { if (h) return stop(); if (left <= 0) { left = secs; box.classList.remove('done'); } btn.textContent = 'Pause';
    h = setInterval(() => { left--; draw(); if (left <= 0) { stop(); box.classList.add('done'); } }, 1000); };
  return { reset(s = secs) { stop(); secs = s; left = s; box.classList.remove('done'); btn.textContent = 'Start'; draw(); }, stop };
}
const gameT = timer($('gameBox'), $('gt'), $('gBtn'), 420);
const qT = timer($('qBox'), $('qt'), $('qBtn'), 20);
function drawTeams() {
  $('teams').innerHTML = '';
  TEAMS.forEach((t, i) => { const r = document.createElement('div'); r.className = 'team';
    r.innerHTML = `<input aria-label="Team ${i + 1} name"><span class="s">${t.s}</span>`;
    const inp = r.querySelector('input'); inp.value = t.n; inp.addEventListener('input', e => t.n = e.target.value);
    $('teams').appendChild(r); });
}
function drawBoard() {
  const b = $('board'); b.innerHTML = '';
  CATS.forEach(c => { const h = document.createElement('div'); h.className = 'cat ' + c.k; h.textContent = c.name; b.appendChild(h); });
  for (let r = 0; r < 4; r++) CATS.forEach((c, ci) => {
    const t = document.createElement('button'); const key = ci + '-' + r;
    t.className = 'tile ' + c.k + (used[key] ? ' used' : '');
    t.textContent = used[key] ? (used[key].length ? 'Points: ' + used[key].join(', ') : 'Done') : r + 1;
    t.setAttribute('aria-label', `${c.name}, ${r + 1} point${r ? 's' : ''}` + (used[key] ? ', used' : ''));
    t.disabled = !!used[key];
    t.onclick = () => openQ(ci, r);
    b.appendChild(t);
  });
}
function openQ(ci, r) {
  cur = { ci, r }; awarded = new Set();
  const c = CATS[ci], q = QS[ci][r];
  $('qCat').textContent = c.name; $('qCat').className = 'badge ' + c.k;
  $('qPts').textContent = `${r + 1} point${r ? 's' : ''}`;
  $('qText').innerHTML = q.q; $('qAns').innerHTML = q.a; $('qAns').classList.add('hidden');
  $('reveal').disabled = false; $('reveal').textContent = 'Show answer';
  $('award').innerHTML = '';
  TEAMS.forEach((t, i) => { const bt = document.createElement('button'); bt.textContent = t.n; bt.setAttribute('aria-pressed', 'false');
    bt.onclick = () => { if (awarded.has(i)) { awarded.delete(i); bt.classList.remove('on'); bt.setAttribute('aria-pressed', 'false'); } else { awarded.add(i); bt.classList.add('on'); bt.setAttribute('aria-pressed', 'true'); } };
    $('award').appendChild(bt); });
  qT.reset(r === 3 && ci === 0 ? 40 : 20);
  $('q').classList.add('open'); $('reveal').focus();
}
function closeQ() {
  if (!cur) return;
  const pts = cur.r + 1; const names = [];
  awarded.forEach(i => { TEAMS[i].s += pts; names.push(TEAMS[i].n); });
  used[cur.ci + '-' + cur.r] = names;
  qT.stop(); cur = null; $('q').classList.remove('open');
  drawTeams(); drawBoard();
}
$('reveal').onclick = () => { $('qAns').classList.remove('hidden'); qT.stop(); $('reveal').disabled = true; $('reveal').textContent = 'Answer shown'; };
$('back').onclick = closeQ;
$('reset').onclick = () => { for (const k in used) delete used[k]; TEAMS.forEach(t => t.s = 0); gameT.reset(); drawTeams(); drawBoard(); };
document.addEventListener('keydown', e => {
  if (!cur || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') closeQ();
  else if (e.key === ' ' && !$('reveal').disabled && document.activeElement === document.body) { e.preventDefault(); $('reveal').click(); }
});
drawTeams(); drawBoard(); gameT.reset();
</script>
